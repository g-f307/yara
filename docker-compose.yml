services:
  # ── PostgreSQL ───────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: yara-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yara
      POSTGRES_PASSWORD: yara_password
      POSTGRES_DB: yara_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yara -d yara_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend FastAPI ──────────────────────────────
  backend:
    build: ./backend
    container_name: yara-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/tests:ro
      - ./data/qiime2:/app/data/qiime2
      - ./backend/uploads:/app/uploads
    environment:
      - STORAGE_PATH=/app/uploads
      - DATABASE_URL=postgresql://yara:yara_password@yara-postgres:5432/yara_db
      - YARA_INTERNAL_API_SECRET=${YARA_INTERNAL_API_SECRET:?Defina YARA_INTERNAL_API_SECRET no arquivo .env da raiz}
      - ENVIRONMENT=development
      - ALLOWED_STORAGE_HOSTS=${ALLOWED_STORAGE_HOSTS:-utfs.io,ufs.sh,*.ufs.sh}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-134217728}
      - MAX_DOWNLOAD_REDIRECTS=${MAX_DOWNLOAD_REDIRECTS:-3}
      - DOWNLOAD_CONNECT_TIMEOUT_SECONDS=${DOWNLOAD_CONNECT_TIMEOUT_SECONDS:-5}
      - DOWNLOAD_READ_TIMEOUT_SECONDS=${DOWNLOAD_READ_TIMEOUT_SECONDS:-30}
      - MAX_ZIP_ENTRIES=${MAX_ZIP_ENTRIES:-2000}
      - MAX_ZIP_UNCOMPRESSED_BYTES=${MAX_ZIP_UNCOMPRESSED_BYTES:-536870912}
      - MAX_ZIP_COMPRESSION_RATIO=${MAX_ZIP_COMPRESSION_RATIO:-100}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Next.js ─────────────────────────────
  frontend:
    build: ./frontend
    container_name: yara-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - ./tests:/tests:ro
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env.local
    environment:
      - PYTHON_CORE_URL=http://backend:8000
      - DATABASE_URL=postgresql://yara:yara_password@yara-postgres:5432/yara_db?schema=public
      - YARA_INTERNAL_API_SECRET=${YARA_INTERNAL_API_SECRET:?Defina YARA_INTERNAL_API_SECRET no arquivo .env da raiz}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
